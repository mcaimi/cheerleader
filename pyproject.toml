[project]
name = "cheerleader"
version = "0.1.0"
description = "A simple but effective binary analyzer"
readme = "README.md"
authors = [{ name = "Marco Caimi", email = "mcaimi@redhat.com" }]
requires-python = ">=3.11"
dependencies = ["capstone>=5.0", "macholib>=1.16.4", "textual>=8.2.8"]

[project.scripts]
cheerleader = "cheerleader:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
